index.lead=Goslin reads lipid names written in the <a href="{0}" target="_blank" rel="noopener">updated shorthand nomenclature</a>, LIPID MAPS, SwissLipids, HMDB and older notations, and returns one harmonized name per lipid with its structural level, sum formula, exact mass and matching LIPID MAPS, SwissLipids and ChEBI entries.
