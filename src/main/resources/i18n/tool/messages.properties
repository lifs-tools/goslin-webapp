index.about.title=About Goslin
index.about.text=Goslin parses lipid names with a set of grammars and reports the level at which a name describes the lipid, from species (<span class="lifs-mono">PC 34:1</span>) to complete structure. Levels and names follow the <a href="{0}" target="_blank" rel="noopener">updated lipid shorthand nomenclature</a>. We work with the <a href="{1}" target="_blank" rel="noopener">Lipidomics Standards Initiative</a> on the nomenclature used to report lipid identifications.
index.problem.title=Found a problem?
index.problem.text=If a name is read incorrectly, <a href="{0}" target="_blank" rel="noopener">report it on GitHub</a> or <a href="{1}" target="_blank" rel="noopener">contact us</a>. LIFS is funded by the BMFTR as part of <a href="{2}" target="_blank" rel="noopener">de.NBI</a>.
