about.goslin.title=About Goslin
index.about.more=More about Goslin
about.goslin.p1=Goslin is a grammar-based parser for lipid names. It reads names written in the <a href="{0}" target="_blank" rel="noopener">updated lipid shorthand nomenclature</a>, LIPID MAPS, SwissLipids, HMDB and older notations, and reports the structural level at which a name describes the lipid, from species (<span class="lifs-mono">PC 34:1</span>) to complete structure (<span class="lifs-mono">PC 16:0/18:1(9Z)</span>).
about.goslin.p2=Goslin harmonizes every name it can read to the shorthand nomenclature and adds the sum formula, the exact mass, the adduct and the matching LIPID MAPS, SwissLipids and ChEBI entries. It uses grammars for the shorthand nomenclature, Goslin, LIPID MAPS, SwissLipids, HMDB and fatty acid names.
about.goslin.p3=The shorthand nomenclature is developed by the <a href="{0}" target="_blank" rel="noopener">Lipidomics Standards Initiative</a>. Goslin implements it, so that lipid names from different sources can be compared. The parsers for Java, Python, C++, R and C# and the grammars are open source in the <a href="{1}" target="_blank" rel="noopener">Goslin repository</a>.
about.privacy.title=Retention and privacy
about.privacy.results=Results, that is the names you submit and the table Goslin returns, are kept for {0,choice,1#1 day|1<{0,number,integer} days} and are then deleted. A result is available under its own address, <code>/result/</code> followed by an identifier. Share that address with care: anyone who has the address can open the result and also correct or remove names in it.
about.privacy.consent=With your consent, the web application counts page views with Matomo, an analytics tool run by LIFS. A page view includes the address of the page, so the address of a result you open is recorded in Matomo as well. The consent banner asks until you accept; if you decline, nothing is counted, but the banner asks again on the next page. If your browser sends Do Not Track, the web application respects it and does not count your page views.
about.privacy.why=Why we ask for your consent: we use these usage statistics to report to our funders how our tools are used. These reports are crucial to support the further development, maintenance and operation of the services. We therefore kindly ask you to give your consent, so that we can use the numbers to convincingly demonstrate the importance of our tools to the community.
about.privacy.server=Separately, the server counts each submitted list of names and each validation request to the REST API in Matomo, anonymously. It sends only technical fields, the site id, the action name, a random request id and the address of the web application, never lipid names or file contents. This happens regardless of your choice in the consent banner.
about.privacy.policy=For details, see the <a href="{0}" target="_blank" rel="noopener">LIFS imprint and privacy policy</a>.
