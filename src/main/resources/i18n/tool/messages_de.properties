about.goslin.title=\u00dcber Goslin
index.about.more=Mehr \u00fcber Goslin
about.goslin.p1=Goslin ist ein grammatikbasierter Parser f\u00fcr Lipidnamen. Er liest Namen in der <a href="{0}" target="_blank" rel="noopener">aktualisierten Kurzschrift-Nomenklatur f\u00fcr Lipide</a>, in LIPID MAPS, SwissLipids, HMDB und \u00e4lteren Schreibweisen und gibt an, auf welcher Strukturebene ein Name das Lipid beschreibt, von der Spezies (<span class="lifs-mono">PC 34:1</span>) bis zur vollst\u00e4ndigen Struktur (<span class="lifs-mono">PC 16:0/18:1(9Z)</span>).
about.goslin.p2=Goslin harmonisiert jeden Namen, den es lesen kann, zur Kurzschrift-Nomenklatur und erg\u00e4nzt Summenformel, exakte Masse, Addukt und die passenden Eintr\u00e4ge aus LIPID MAPS, SwissLipids und ChEBI. Dazu nutzt es Grammatiken f\u00fcr die Kurzschrift-Nomenklatur, Goslin, LIPID MAPS, SwissLipids, HMDB und Fetts\u00e4urenamen.
about.goslin.p3=Die Kurzschrift-Nomenklatur wird von der <a href="{0}" target="_blank" rel="noopener">Lipidomics Standards Initiative</a> entwickelt. Goslin setzt sie um, damit Lipidnamen aus verschiedenen Quellen vergleichbar sind. Die Parser f\u00fcr Java, Python, C++, R und C# und die Grammatiken sind im <a href="{1}" target="_blank" rel="noopener">Goslin-Repository</a> quelloffen verf\u00fcgbar.
about.privacy.title=Aufbewahrung und Datenschutz
about.privacy.results=Ergebnisse, also die eingegebenen Namen und die Tabelle, die Goslin liefert, werden {0} Tage aufbewahrt und danach gel\u00f6scht. Jedes Ergebnis hat eine eigene Adresse, <code>/result/</code> gefolgt von einer Kennung. Jeder, der diese Adresse kennt, kann das Ergebnis \u00f6ffnen. Geben Sie sie daher mit Bedacht weiter.
about.privacy.consent=Mit Ihrer Einwilligung z\u00e4hlt die Webanwendung Seitenaufrufe mit Matomo, einem Analysewerkzeug, das LIFS betreibt. Der Einwilligungshinweis fragt einmal danach. Sendet Ihr Browser Do Not Track, beachtet die Webanwendung das und z\u00e4hlt Ihre Seitenaufrufe nicht.
about.privacy.server=Unabh\u00e4ngig davon z\u00e4hlt der Server jede Validierung anonym in Matomo. Er sendet nur technische Felder, n\u00e4mlich die Website-Kennung, den Aktionsnamen, eine zuf\u00e4llige Anfrage-Kennung und die Adresse der Webanwendung, niemals Lipidnamen oder Dateiinhalte. Das geschieht unabh\u00e4ngig von Ihrer Auswahl im Einwilligungshinweis.
about.privacy.policy=Einzelheiten stehen im <a href="{0}" target="_blank" rel="noopener">Impressum und in der Datenschutzerkl\u00e4rung von LIFS</a>.
