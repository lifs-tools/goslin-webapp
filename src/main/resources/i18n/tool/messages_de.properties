index.title=Lipidnamen harmonisieren
index.lead=Goslin liest Lipidnamen in der <a href="{0}" target="_blank" rel="noopener">aktualisierten Kurzschrift-Nomenklatur</a>, in LIPID MAPS, SwissLipids, HMDB und \u00e4lteren Schreibweisen und gibt f\u00fcr jedes Lipid einen harmonisierten Namen zur\u00fcck, mit Strukturebene, Summenformel, exakter Masse und passenden Eintr\u00e4gen in LIPID MAPS, SwissLipids und ChEBI.
