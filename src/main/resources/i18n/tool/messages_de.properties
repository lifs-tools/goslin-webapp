index.about.title=\u00dcber Goslin
index.about.text=Goslin liest Lipidnamen mit einer Reihe von Grammatiken und gibt an, auf welcher Ebene ein Name das Lipid beschreibt, von der Spezies (<span class="lifs-mono">PC 34:1</span>) bis zur vollst\u00e4ndigen Struktur. Ebenen und Namen folgen der <a href="{0}" target="_blank" rel="noopener">aktualisierten Kurzschrift-Nomenklatur f\u00fcr Lipide</a>. Mit der <a href="{1}" target="_blank" rel="noopener">Lipidomics Standards Initiative</a> arbeiten wir an der Nomenklatur f\u00fcr die Angabe von Lipididentifikationen.
index.problem.title=Ein Problem gefunden?
index.problem.text=Wenn ein Name falsch gelesen wird, <a href="{0}" target="_blank" rel="noopener">melden Sie es auf GitHub</a> oder <a href="{1}" target="_blank" rel="noopener">kontaktieren Sie uns</a>. LIFS wird vom BMFTR als Teil von <a href="{2}" target="_blank" rel="noopener">de.NBI</a> gef\u00f6rdert.
