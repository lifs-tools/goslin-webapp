        <!-- The manual: grammars, hierarchy, interactive usage and the REST API. Rendered by documentation.html. -->
        <th:block th:fragment="manual">
        <section id="grammars" class="doc-section" aria-labelledby="grammars-title">
            <h2 id="grammars-title">Lipid shorthand nomenclature grammars</h2>
            <div class="lifs-prose">
                <p>Goslin uses ANTLRv4 compatible context-free EBNF grammars. All Goslin implementations use a
                    generic recursive decent parser (see <a href="https://en.wikipedia.org/wiki/Context-free_language" rel="nofollow" target="_blank">Context-free language</a>, <a href="https://en.wikipedia.org/wiki/LL_parser" rel="nofollow" target="_blank">LL parser</a>, <a href="https://www.antlr.org/about.html" rel="nofollow" target="_blank">ANTLRv4</a>).</p>
                <p>These grammars (*.g4 files) are available from our Goslin GitHub repository at <a href="https://github.com/lifs-tools/goslin" target="_blank" rel="noopener">https://github.com/lifs-tools/goslin</a>.</p>
            </div>
        </section>

        <section id="hierarchy" class="doc-section" aria-labelledby="hierarchy-title">
            <h2 id="hierarchy-title">Hierarchical representation of lipids</h2>
            <div class="lifs-prose">
                <p>The grammars model lipids as hierarchically structured bits of information.
                    We do not model the lipid category or main class explicitly, but rather keep them in a global lookup table data structure, derived from the <a href="https://github.com/lifs-tools/goslin/blob/master/lipid-list.csv" target="_blank"><code>lipid-list.csv</code></a> file for reference.
                    This allows us to keep the grammars clutter-free and makes them easier to read.</p>
                <p>The structural classification of lipids follows the shorthand notation recently updated by Liebisch et al. and is compatible to that of LIPID MAPS. The following example shows the hierarchical representation of PE 16:1(6Z)/16:0;5OH[R],8OH;3oxo:</p>
                <p class="doc-caption"><b>Table 1.</b> Structural hierarchy representation of PE 16:1(6Z)/16:0;5OH[R],8OH;3oxo. LM: LIPID MAPS, HG: Head Group, FA: Fatty Acyl</p>
                <div class="lifs-table-wrap"><table class="lifs-table"><thead>
                                <tr>
                                    <th scope="col">Level</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Description</th>
                                </tr></thead><tbody>
                                <tr>
                                    <td>Category (LM)</td>
                                    <td>Glycerophospholipids (GP)</td>
                                    <td>Lipid category</td>
                                </tr>
                                <tr>
                                    <td>Class (LM)</td>
                                    <td>Glycerophosphoethanolamine (PE) GP02</td>
                                    <td>Lipid class</td>
                                </tr>
                                <tr>
                                    <td>Species (LM Subclass)</td>
                                    <td>Phosphatidylethanolamine, PE 32:2;O3</td>
                                    <td>HG, FA summary, two double bond equivalents, three oxidations</td>
                                </tr>
                                <tr>
                                    <td>Molecular species</td>
                                    <td>PE 16:1_16:1;O3</td>
                                    <td>HG, two FAs, two double bond equivalents, three oxidations</td>
                                </tr>
                                <tr>
                                    <td><i>sn</i>-Position</td>
                                    <td>PE 16:1/16:1;O3</td>
                                    <td>HG, SN positions, here: for FA1 at sn1 and FA2 at sn2, two double bond equivalents, three oxidations</td>
                                </tr>
                                <tr>
                                    <td>Structure defined</td>
                                    <td>PE 16:1(6)/16:1;(OH)2;oxo</td>
                                    <td>HG, SN positions, here: for FA1 at sn1 and FA2 at sn2, three oxidations and unspecified stereo configuration (6) on FA1</td>
                                </tr>
                                <tr>
                                    <td>Full structure</td>
                                    <td>PE 16:1(6Z)/16:1;5OH,8OH;3oxo</td>
                                    <td>HG, SN positions, here: for FA1 at sn1 and FA2 at sn2, positions for oxidations and stereo configuration (6Z) on FA1</td>
                                </tr>
                                <tr>
                                    <td>Complete structure</td>
                                    <td>PE 16:1(6Z)/16:0;5OH[R],8OH;3oxo</td>
                                    <td>HG, SN positions, here: for FA1 at sn1 and FA2 at sn2, positions for oxidations and stereo configuration ([R]) and double bond position and stereo configuration (6Z) on FA1</td>
                                </tr>
                            </tbody></table></div>
                <p>Please see <a href="https://github.com/lifs-tools/goslin/tree/master/docs#9-goslin-object-model" target="_blank" title="The Goslin object model">the Goslin object model</a> for an overview of the Goslin domain model which is used to represent the structural hierarchy by the different implementations.</p>
            </div>
        </section>

        <section id="interactive-usage" class="doc-section" aria-labelledby="interactive-usage-title">
            <h2 id="interactive-usage-title">Interactive usage</h2>
            <div class="lifs-prose">
                <p>The interactive Goslin web application is available at
                    <a href="https://apps.lifs-tools.org/goslin">https://apps.lifs-tools.org/goslin</a>. It harmonizes lipid names: Goslin reads each name,
                    checks it against the lipid shorthand nomenclature and returns it in the harmonized shorthand notation, together with its
                    classification, mass, sum formula and links to external databases.</p>

                <h3 id="entering-names">Entering names</h3>
                <p>The <em>Harmonize</em> page has one text box with one lipid name per line (see <a href="#fig:goslin-webapp-form-01">Figure 1</a>).
                    Type or paste your names into it. Blank lines are allowed, they are not submitted but still count when lines are numbered.
                    <em>Load example names</em> fills the box with example names to try out. Goslin harmonizes all of them; to see how invalid names are reported, add a name it cannot read.</p>
                <p>You can also use <em>Upload a file</em> or drop a text file (<code>.txt</code>, <code>.csv</code> or <code>.tsv</code>) onto the box. The file content
                    is placed in the text box, so you can check and edit it before you submit it. Names can be at most 300 characters long.
                    Files and texts larger than the size limit shown on the page, or with more than 5,000 names, are refused with a message.</p>
                <figure>
                    <a id="fig:goslin-webapp-form-01"><img th:src="@{/img/goslin-webapp-form-01.png}" alt="The Harmonize page with an empty text box" style="max-width:100%;"/></a>
                    <figcaption><b>Figure 1.</b>&nbsp;The Harmonize page: one text box for the lipid names, one per line. Names can be typed, pasted, loaded as examples, or read from a file.</figcaption>
                </figure>

                <h3 id="skip-invalid-names">Skip invalid names</h3>
                <p>With <em>Skip invalid names</em> ticked (the default), Goslin harmonizes all names it can read and lists the others on the result page,
                    where you can correct them. If you clear the tick, nothing is harmonized as long as one name cannot be read:
                    the page then lists the names that failed, by line, with a plain-language hint (see <a href="#fig:goslin-webapp-form-02a">Figure 2</a>),
                    so that you can correct them in the box and submit again. The order of the names is always preserved.</p>
                <figure>
                    <a id="fig:goslin-webapp-form-02"><img th:src="@{/img/goslin-webapp-form-02.png}" alt="The Harmonize page with lipid names and the option Skip invalid names" style="max-width:100%;"/></a>
                    <figcaption><b>Figure 2.</b>&nbsp;Names entered in the text box. Tick <em>Skip invalid names</em> to proceed to the result even if some names cannot be read.</figcaption>
                </figure>
                <figure>
                    <a id="fig:goslin-webapp-form-02a"><img th:src="@{/img/goslin-webapp-form-02a.png}" alt="The list of names that could not be read, by line" style="max-width:100%;"/></a>
                    <figcaption><b>Figure 3.</b>&nbsp;Without <em>Skip invalid names</em>, names that cannot be read are listed by line, with a hint on what is wrong.</figcaption>
                </figure>

                <h3 id="result-page">The result page</h3>
                <p>After <em>Harmonize</em>, the result page (see <a href="#fig:goslin-webapp-form-03">Figure 4</a>) shows how many names were submitted, how many were
                    harmonized and how many could not be read. Each name keeps the <b>line number</b> of the text you submitted.</p>
                <p><b>Correct these names.</b> Names Goslin could not read are listed first, with the part where Goslin stopped reading underlined and a hint in plain
                    language, for example that a closing bracket is missing or that the head group is not recognised. Edit a name in place and choose <em>Re-run corrected
                        names</em> (or press <kbd>Enter</kbd> in the name field). Corrected names that can now be harmonized move into the table, keeping their line number; the
                    harmonized names already in the table are kept. <em>Remove</em> drops a name you do not need from the result.</p>
                <p><b>The table.</b> Harmonized names are shown in a table with the submitted name, the harmonized name, the lipid level, the LIPID MAPS category and class,
                    the sum formula, the mass and links to external databases where the name matches an entry. You can filter the table by text, by
                    lipid level and by LIPID MAPS category, sort it by clicking a column heading, and page through it. Use the arrow at the start of a row to show its
                    details (see <a href="#fig:goslin-webapp-form-04">Figure 5</a>): the classification, the fatty acyls with their carbon atoms, double bonds and
                    functional groups, and cross-links to external databases.</p>
                <figure>
                    <a id="fig:goslin-webapp-form-03"><img th:src="@{/img/goslin-webapp-result-03.png}" alt="The result page with counts, names to correct and the table" style="max-width:100%;"/></a>
                    <figcaption><b>Figure 4.</b>&nbsp;The result page: counts, the names to correct, filters and the table of harmonized names.</figcaption>
                </figure>
                <figure>
                    <a id="fig:goslin-webapp-form-04"><img th:src="@{/img/goslin-webapp-result-detail-04.png}" alt="The details of one harmonized lipid name" style="max-width:100%;"/></a>
                    <figcaption><b>Figure 5.</b>&nbsp;The details of a name. Depending on the lipid level, they include each individual fatty acyl. Cross-links are shown where the harmonized name could be matched unambiguously against the databases.</figcaption>
                </figure>

                <h3 id="download-and-keeping-results">Download and keeping results</h3>
                <p><em>Download table (TSV)</em> saves the result as a tab-separated file. Its first columns are <code>Line</code> (the line number in your text),
                    the harmonized name, <code>Original Name</code> and <code>Corrected Name</code> (the name you corrected and re-ran, if any),
                    followed by the grammar, validation messages, adduct and the further properties. Names that could not be read are included in the file.
                    Depending on the lipid level, undefined sn positions of regular lipids are reported as "-1" and as "0" for solitary fatty acids.</p>
                <p>Every result has its own address, <code>/result/</code> followed by an identifier. You can bookmark it or share it. Results are kept for <b>7 days</b>
                    and are then deleted.</p>
                <p>The source code for the web application and instructions to build it as a Docker container are available at
                    <a href="https://github.com/lifs-tools/goslin-webapp" target="_blank" rel="noopener">https://github.com/lifs-tools/goslin-webapp</a> under the terms of the open source Apache license version 2.</p>
            </div>
        </section>

        <section id="rest-api" class="doc-section" aria-labelledby="rest-api-title">
            <h2 id="rest-api-title">Programmatic access via the REST API</h2>
            <div class="lifs-prose">

                        <div>
                            <p>An interactive documentation for the rest api of the goslin web
                                application is available at
                                <a href="https://apps.lifs-tools.org/goslin/swagger-ui/index.html" rel="nofollow">https://apps.lifs-tools.org/goslin/swagger-ui/index.html</a> (see <a href="#fig:goslin-webapp-rest-05">Figure 6.</a>). To
                                illustrate its usage, we will briefly show a small example how a user
                                can access the rest api with a standard http client.</p>
                        </div>
                        <figure >
                            <a id="fig:goslin-webapp-rest-05" ><img th:src="@{/img/goslin-webapp-rest-05.png}" alt="RESTForm" style="max-width:100%;"/></a>
                            <figcaption ><b>Figure 6.</b>&nbsp;The goslin web application provides an interactive documentation for its rest api to simplify programmatic access.</figcaption>
                        </figure>
                        <div>
                            <p>The Structure for the request consists of a json object&nbsp;\{} enclosing
                                two lists, with the names <code>lipidNames</code> and <code>grammars</code>. Acceptable values
                                for <code>grammars</code> are: <code>LIPIDMAPS</code>, <code>GOSLIN</code>, <code>SHORTHAND</code>, <code>FATTY_ACID</code>, 
                                <code>SWISSLIPIDS</code>, and <code>HMDB</code>. A complete list is available from the
                                interactive rest api documentation’s <code>Models</code> section under
                                <code>ValidationRequest</code>. The available grammars may also be retrieved by the <a th:href="@{/swagger-ui/index.html}">grammars</a> method. Both fields in the <code>ValidationRequest</code> accept
                                comma-separated entries, enclosed in double quotes:</p>
                        </div>
                        <div>
                            <div>
                                <pre>  {
      "lipidNames": [
        "Cer(d18:1/16:1(6Z))"
      ],
      "grammars": [
        "LIPIDMAPS"
      ]
  }</pre>
                            </div>
                        </div>
                        <div>
                            <p>Each lipid name may have at most 300 characters (after trimming and collapsing
                                whitespace). If any name in a request is longer, the rest api rejects the whole
                                request with a response code of 400 (Client error) and a message naming the position of the
                                first offending name, e.g. <code>Name 3 is longer than 300 characters.</code>; no name is parsed.</p>
                        </div>
                        <div>
                            <p>Sending the http POST request with <code>curl</code> as an http client looks as
                                follows:</p>
                        </div>
                        <div>
                            <div>
                                <pre>  curl -X POST "https://apps.lifs-tools.org/goslin/rest/validate" -H  "accept: */*" -H  "Content-Type: application/json" -d "{  \"lipidNames\": [    \"Cer(d18:1/16:1(6Z))\"  ],  \"grammars\": [    \"LIPIDMAPS\"  ]}"</pre>
                            </div>
                        </div>
                        <div>
                            <p>The rest api will return the following result for the request, with a
                                http response code of 200 (OK). This result returns a map of properties
                                for each lipid name that was parsed. If at least one name is not
                                parseable, the rest api will return a response code of 400 (Client
                                error), together with the same results reponse object. In that case, the
                                <code>failedToParse</code> field in the response will contain the number of lipid
                                names that could not be parsed. For those results where no grammar was
                                applicable, the <code>grammar</code> field will contain the string
                                <code>NOT_PARSEABLE</code>.¸In other cases, that field will contain the last
                                grammar used to parse the lipid name and the <code>messages</code> field will
                                contain a list of validation messages that help to narrow down the
                                offending bits in the lipid name.</p>
                        </div>
                        <div>
                            <div>
                                <pre><code class="language-json">
{
  "results": [
    {
      "lipidName": "Cer(d18:1/16:1(6Z))",
      "grammar": "LIPIDMAPS",
      "messages": [],
      "lipidAdduct": {
        "lipid": {
          "headGroup": {
            "headgroup": "Cer",
            "lipidCategory": "SP",
            "lipidClass": 29,
            "className": "Cer"
          },
          "info": {
            "name": "info",
            "position": 0,
            "count": 1,
            "doubleBonds": {
              "numDoubleBonds": 2,
              "doubleBondPositions": {}
            },
            "functionalGroups": {
              "OH": [
                {
                  "name": "OH",
                  "position": -1,
                  "count": 2,
                  "doubleBonds": {
                    "numDoubleBonds": 0,
                    "doubleBondPositions": {}
                  },
                  "functionalGroups": {},
                  "ndoubleBonds": 0
                }
              ]
            },
            "numCarbon": 34,
            "lipidFaBondType": "LCB_EXCEPTION",
            "level": "SN_POSITION",
            "numEthers": 0,
            "numSpecifiedFa": 1,
            "totalFa": 2,
            "extendedClass": "ESTER",
            "lipidClass": 29,
            "ndoubleBonds": 2
          },
          "faList": [
            {
              "name": "LCB",
              "position": 1,
              "count": 1,
              "doubleBonds": {
                "numDoubleBonds": 1,
                "doubleBondPositions": {}
              },
              "functionalGroups": {
                "OH": [
                  {
                    "name": "OH",
                    "position": -1,
                    "count": 2,
                    "doubleBonds": {
                      "numDoubleBonds": 0,
                      "doubleBondPositions": {}
                    },
                    "functionalGroups": {},
                    "ndoubleBonds": 0
                  }
                ]
              },
              "numCarbon": 18,
              "lipidFaBondType": "LCB_EXCEPTION",
              "ndoubleBonds": 1
            },
            {
              "name": "FA1",
              "position": 2,
              "count": 1,
              "doubleBonds": {
                "numDoubleBonds": 1,
                "doubleBondPositions": {
                  "6": "Z"
                }
              },
              "functionalGroups": {},
              "numCarbon": 16,
              "lipidFaBondType": "ESTER",
              "ndoubleBonds": 1
            }
          ],
          "lipidLevel": "SN_POSITION",
          "lipidString": "Cer 18:1;O2/16:1",
          "extendedClass": "Cer"
        },
        "adduct": null,
        "className": "Cer",
        "lipidLevel": "SN_POSITION",
        "extendedClass": "Cer",
        "lipidString": "Cer 18:1;O2/16:1",
        "mass": 535.4964451650001,
        "sumFormula": "C34H65NO3"
      },
      "functionalGroupCounts": {
        "OH": 2
      },
      "normalizedName": "Cer 18:1;O2/16:1",
      "lipidMapsCategory": "SP",
      "lipidMapsClass": "SP02",
      "mass": 535.4964451650001,
      "sumFormula": "C34H65NO3",
      "lipidMapsReferences": [],
      "swissLipidsReferences": []
    }
  ],
  "totalReceived": 1,
  "totalParsed": 1,
  "failedToParse": 0
}
</code></pre>
                            </div>
                        </div>
                        <div>
                            <p>The response part also reports the harmonized name (<code>normalizedName</code>), as
                                well as classification information using the LIPID MAPS&REG; category and
                                class associated to the parsed lipid.</p>
                        </div>
                        <div>
                            <div>
                                <pre><code>
...
"normalizedName": "Cer 18:1;O2/16:1",
"lipidMapsCategory": "SP",
"lipidMapsClass": "SP02",
"mass": 535.4964451650001,
"sumFormula": "C34H65NO3",
...
</code></pre>
                            </div>
                        </div>
                        <div>
                            <p>The response also reports information on the fatty acyls detected in the
                                lipid name. In this case, a Ceramide with a long-chain base and an additional fatty acyl has been detected. The
                                name given here as an example was classified on SN_position level, since the lcb contains one double bond, but without positional
                                E/Z information. The fatty acyl FA1 at the sn2 position does report E/Z
                                information for its double bond.</p>
                        </div>
                        <div>
                            <div>
                                <pre><code>
...
"faList": [
  {
    "name": "LCB",
    "position": 1,
    "count": 1,
    "doubleBonds": {
      "numDoubleBonds": 1,
      "doubleBondPositions": {}
    },
    "functionalGroups": {
      "OH": [
        {
          "name": "OH",
          "position": -1,
          "count": 2,
          "doubleBonds": {
            "numDoubleBonds": 0,
            "doubleBondPositions": {}
          },
          "functionalGroups": {},
          "ndoubleBonds": 0
        }
      ]
    },
    "numCarbon": 18,
    "lipidFaBondType": "LCB_EXCEPTION",
    "ndoubleBonds": 1
  },
  {
    "name": "FA1",
    "position": 2,
    "count": 1,
    "doubleBonds": {
      "numDoubleBonds": 1,
      "doubleBondPositions": {
        "6": "Z"
      }
    },
    "functionalGroups": {},
    "numCarbon": 16,
    "lipidFaBondType": "ESTER",
    "ndoubleBonds": 1
  }
],
...                                    
</code></pre>
                                
                            </div>
                        </div>
                        <div>
                            <p>Finally, the response reports the total number lipid names received, the
                                total number parsed and the total number of parsing failures.</p>
                        </div>
                        <div>
                            <div>
                                <pre><code>
...
"totalReceived": 1,
"totalParsed": 1,
"failedToParse": 0
...                                    
</code></pre>
                            </div>
                        </div>
            </div>
        </section>
