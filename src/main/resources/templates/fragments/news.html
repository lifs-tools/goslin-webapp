<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xmlns:th="http://www.thymeleaf.org">
    <head><title/></head>
    <body>
        <!-- The sections of documentation.html around the manual; each has an id that the table of contents links to. -->
        <section th:fragment="news" id="news" class="doc-section" aria-labelledby="news-title" th:if="${news != null && !news.isEmpty()}">
            <h2 id="news-title">News and updates</h2>
            <div class="news">
                <details class="news__entry" th:each="newsEntry, itemStat : ${news}" th:open="${itemStat.index == 0}">
                    <summary>
                        <span class="news__title" th:text="${newsEntry.title}">Added adducts, masses and sum formulas</span>
                        <span class="news__date" th:text="${newsEntry.date}">v1.0.19 - May 12th, 2020</span>
                    </summary>
                    <div class="news__body lifs-prose">
                        <div th:utext="${newsEntry.content}">This release adds support for adducts.</div>
                        <p th:if="${newsEntry.link != null and !#strings.isEmpty(newsEntry.link)}"><a th:href="${newsEntry.link}" href="#" target="_blank" rel="noopener">Release notes</a></p>
                    </div>
                </details>
            </div>
        </section>

        <section th:fragment="lipidclasses" id="lipid-classes" class="doc-section" aria-labelledby="lipid-classes-title">
            <h2 id="lipid-classes-title">Lipid classes supported by Goslin and the web application</h2>
            <div class="lifs-field doc-filter" th:unless="${#lists.isEmpty(lipidClasses)}">
                <label class="lifs-label" for="filter-classes">Filter the lipid classes</label>
                <input id="filter-classes" class="lifs-input" type="search" autocomplete="off" placeholder="Class, category or synonym, e.g. PC or Ceramide"
                       data-filter-target="#lipid-classes" aria-controls="lipid-classes"/>
                <p class="lifs-note" id="filter-classes-status" role="status" aria-live="polite"></p>
            </div>
            <div class="lifs-table-wrap" th:unless="${#lists.isEmpty(lipidClasses)}">
                <table id="lipid-classes" class="lifs-table">
                    <caption class="visually-hidden">Lipid classes supported by Goslin</caption>
                    <thead>
                        <tr>
                            <th scope="col">Lipid category</th>
                            <th scope="col">LIPID MAPS class name</th>
                            <th scope="col">Allowed #s of FAs</th>
                            <th scope="col">Maximum # of FAs</th>
                            <th scope="col">Sum formula (head group)</th>
                            <th scope="col">Mass (head group)</th>
                            <th scope="col">Synonyms</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="lipidClass : ${lipidClasses}">
                            <td th:text="${lipidClass.lipidCategory}"></td>
                            <td th:text="${lipidClass.description}"></td>
                            <td th:text="${lipidClass.possibleNumFa}"></td>
                            <td th:text="${lipidClass.maxNumFa}"></td>
                            <td th:if="${lipidClass.getElements()==null}"><abbr title="Not defined">N.D.</abbr></td>
                            <td th:unless="${lipidClass.getElements()==null}" th:text="${lipidClass.getElements().getSumFormula()}"></td>
                            <td th:if="${lipidClass.getElements().getMass()>0}" th:text="${#numbers.formatDecimal(lipidClass.getElements().getMass(), 1, 4)}"></td>
                            <td th:unless="${lipidClass.getElements().getMass()>0}"><abbr title="Not defined">N.D.</abbr></td>
                            <td th:text="${lipidClass.synonyms}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section th:fragment="contributing" id="contributing" class="doc-section" aria-labelledby="contributing-title">
            <h2 id="contributing-title">Contributing</h2>
            <div class="lifs-prose">
                <p>If you find that Goslin does not report a lipid name correctly, or is missing some information, please <a href="https://github.com/lifs-tools/goslin-webapp" target="_blank" rel="noopener">file a bug report or pull request at our GitHub repository</a>.</p>
                <p>Please see the <a href="https://github.com/lifs-tools/goslin" target="_blank" rel="noopener">Goslin GitHub repository</a> for the other programming language implementations and for the lipid-list.csv file, which contains information on which lipid head groups Goslin currently supports.</p>
                <h3>Using the Goslin implementations</h3>
                <p>The Goslin grammars are supported by parser implementations in multiple programming languages and use a similar object model. For details, please see the <a target="_blank" rel="noopener" href="https://github.com/lifs-tools/goslin/docs">documentation at GitHub</a>.</p>
            </div>
        </section>

        <section th:fragment="citing" id="citing" class="doc-section" aria-labelledby="citing-title">
            <h2 id="citing-title">Citing Goslin</h2>
            <ol class="lifs-prose doc-refs">
                <li><a href="#" target="_blank" rel="noopener">Goslin 2.0 implements the recent lipid shorthand nomenclature for MS-derived lipid structures. Dominik Kopczynski, Nils Hoffmann, Bing Peng, Gerhard Liebisch, Friedrich Spener, Robert Ahrends. Preprint <b>2021</b></a></li>
                <li><a href="https://pubs.acs.org/doi/10.1021/acs.analchem.0c01690" target="_blank" rel="noopener">Goslin - A Grammar of Succinct Lipid Nomenclature. Dominik Kopczynski, Nils Hoffmann, Bing Peng, Robert Ahrends. Analytical Chemistry <b>2020</b> 92 (16), 10957-10960</a></li>
            </ol>
        </section>

        <section th:fragment="acknowledgements" id="acknowledgements" class="doc-section" aria-labelledby="acknowledgements-title">
            <h2 id="acknowledgements-title">Acknowledgements</h2>
            <div class="lifs-prose">
                <p>In order to test lipid name parsing, sum formula calculation and cross-linking to reported lipids, the following resources were crucial during development and testing of Goslin and the Goslin web application:</p>
                <ol class="doc-refs">
                    <li><a href="https://www.swisslipids.org" target="_blank" rel="noopener">SwissLipids database</a></li>
                    <li><a href="https://www.lipidmaps.org" target="_blank" rel="noopener">LIPID MAPS&reg; database</a></li>
                    <li><a href="https://hmdb.ca/" target="_blank" rel="noopener">HMDB database</a></li>
                    <li><a href="https://www.ebi.ac.uk/chebi/" target="_blank" rel="noopener">ChEBI ontology</a></li>
                </ol>
                <p>Please see the <a href="https://github.com/lifs-tools/goslin" target="_blank" rel="noopener">Goslin GitHub repository</a> for details on the database versions, dates and data that we used for development and testing.</p>
            </div>
        </section>
    </body>
</html>
