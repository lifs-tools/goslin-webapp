<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head th:replace="~{lifs/layout :: head(${page?.title})}"></head>
    <body>
        <link rel="stylesheet" th:href="@{/css/goslin.css}" href="/css/goslin.css"/>
        <header th:replace="~{fragments/nav :: app-bar(active='documentation')}"></header>

        <main id="main" class="lifs-main" tabindex="-1">
            <div th:replace="~{lifs/layout :: messages}"></div>

            <section class="lifs-hero" aria-labelledby="page-title">
                <div class="lifs-hero__text">
                    <p class="lifs-eyebrow">LIFS Tools · Goslin</p>
                    <h1 id="page-title">Documentation</h1>
                    <p class="lifs-lead">How Goslin reads lipid names, how to use the web application and the REST API, and which lipid classes are supported.</p>
                </div>
            </section>

            <div class="doc">
                <nav id="toc" class="doc__toc" aria-label="On this page">
                    <p class="lifs-eyebrow">On this page</p>
                    <ul>
                        <li><a href="#grammars">Grammars</a></li>
                        <li><a href="#hierarchy">Hierarchical representation</a></li>
                        <li><a href="#interactive-usage">Interactive usage</a></li>
                        <li><a href="#rest-api">REST API</a></li>
                        <li><a href="#lipid-classes">Lipid classes</a></li>
                    </ul>
                </nav>
                <div class="doc__content">
                    <th:block th:replace="~{fragments/manual :: manual}"></th:block>
                    <th:block th:replace="~{fragments/news :: lipidclasses}"></th:block>
                </div>
            </div>
        </main>

        <footer th:replace="~{lifs/layout :: footer}"></footer>
        <th:block th:replace="~{lifs/layout :: tracking}"></th:block>

        <script th:src="@{/js/goslin.js}" src="/js/goslin.js" defer></script>
    </body>
</html>
