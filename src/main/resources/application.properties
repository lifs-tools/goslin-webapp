logging.level.de.isas.lifs.lifsapps.webapp.domain.validation=OFF
logging.level.de.isas.lipidomics.palinom=OFF
logging.level.de.isas.lifs.palinom.webapp.services.LipidNameValidationService=OFF
logging.level.org.springframework.web=INFO
logging.level.de.isas=INFO
server.port=8083
spring.web.error.whitelabel.enabled=false
spring.web.error.path=/error
# Use the X-Forwarded-* headers of the reverse proxy (Tomcat's RemoteIpValve).
server.request.header.forwarded.strategy=web-server
server.tomcat.remoteip.internal-proxies=.*
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.servlet.use-relative-redirects=true
# Pasted names are a form post. The text is capped at the smaller of spring.servlet.multipart.max-file-size
# and jgoslin.maxItemsInRequest x 302 bytes (300-character names plus line break), about 1.5 MB for 5,000
# names. Keep these at least ~3 times that text cap (percent-encoding can triple the text) and large enough
# for the result page's re-run post with up to 5,000 edit[N] parameters.
server.tomcat.max-swallow-size=8MB
server.tomcat.max-http-form-post-size=8MB
# Tomcat 11 parses at most 1,000 request parameters by default; a re-run posts one per failed name.
server.tomcat.max-parameter-count=12000
# Result pages with thousands of rows are large but repetitive: gzip shrinks them about 10 times.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,text/plain,text/tab-separated-values,image/svg+xml

jgoslin.version.number=@jgoslin.version@
jgoslin.maxItemsInRequest=5000
server.servlet.contextPath=@contextPath@
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=512KB

# The REST API keeps the JSON of Jackson 2: declaration order, null accepted for primitives, ...
spring.jackson.use-jackson2-defaults=true
# Swagger UI and the OpenAPI document are public on purpose.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.thymeleaf.cache=true
spring.messages.basename=i18n.messages,i18n.tool.messages
# Message bundles encoding.
spring.messages.encoding=UTF-8
# Whether to fall back to the system Locale 
# if no files for a specific Locale have been found.
spring.messages.fallback-to-system-locale=false
# Whether to use the message code as the default message instead of throwing a "NoSuchMessageException". 
# Recommended during development only.
spring.messages.use-code-as-default-message=false

storage.location=${java.io.tmpdir}/@app.name@/upload-dir
#minimum age of user directories to clean up
minCleanupAge=7
#execute at 11pm every day
oldFileMaintenanceSchedule=0 0 23 * * *
#spring.mvc.locale-resolver=accept_header
#spring.mvc.locale=en

lifs.user.url=https://lifs-tools.org/auth

keycloak.auth-server-url=https://lifs-tools.org/auth
#keycloak.frontendUrl=https://lifs-tools.org/auth
keycloak.realm=lifs
keycloak.resource=lifs-apps
keycloak.public-client=false
keycloak.use-resource-role-mappings=true
keycloak.enable-basic-auth=true
keycloak.principal-attribute=preferred_username
keycloak.ssl-required=external
keycloak.confidential-port=443

spring.config.import=\
  classpath:lifs.properties,
  classpath:news.properties,
  classpath:tool.properties,
  classpath:tracking.properties

# Parse results are cached per result revision; bound = total names across cached results.
goslin.result-cache.max-entries=20000

# Parse time limits. jgoslin's parse time grows steeply with the length of a name: a 300-character run of
# digits takes about half a minute per grammar, while real lipid names take milliseconds. Durations are
# written 20s, 2m or 500ms; 0 turns a limit off.
# The longest time for one name, across all grammars tried for it, counted from when the name is handed to
# the parse pool (time waiting in its queue counts). A name that takes longer is reported as failed.
goslin.parser.time-limit=20s
# The longest time for all names of one validation: a submitted list, a re-run, a result page that is not in
# the cache, a REST call. The names left when it is reached are reported as failed, "not processed".
goslin.parser.request-time-limit=120s
# Threads of the parse pool, shared by all requests; the default is the number of processors, at least 2.
# A parse that ran out of time keeps its thread until the grammar it is in is done (jgoslin cannot be
# interrupted), but does not try the next grammar.
#goslin.parser.threads=4
