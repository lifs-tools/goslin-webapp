# Pull requests: the tests (unit tests and Spring Boot tests with MockMvc), then the end-to-end tests
# (Playwright, e2e/) against the packaged jar.
# master: the same, then the SNAPSHOT jar is deployed and the docker image pushed (version tag only).
# Releases: .github/workflows/release.yml calls this workflow for the tests (publish is skipped there).
# Make "Tests" and "End-to-end tests" required checks of the master branch protection to merge only
# green pull requests.
name: CI

on:
  pull_request:
    branches: [ master, release ]
  push:
    branches: [ master, release ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_ARGS: --no-transfer-progress

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          common-ref: ${{ vars.LIFS_WEBAPPS_COMMON_REF || 'master' }}
      - name: Build and run the tests
        run: ./mvnw -B verify
      - name: Upload the application jar
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/lifs-goslin-webapp-*.jar
          retention-days: 3
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  e2e:
    name: End-to-end tests
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download the application jar
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: target
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Install the test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # playwright.config.ts starts the jar (scripts/start-app.sh) on port 8083; the tests never reach Matomo
      - name: Run the end-to-end tests
        env:
          CI: 'true'
        run: npm test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          common-ref: ${{ vars.LIFS_WEBAPPS_COMMON_REF || 'master' }}
      - name: Set Git user
        run: |
          git config --global committer.email "noreply@github.com"
          git config --global committer.name "GitHub"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"
      - name: Setup Maven settings.xml
        # Maven resolves the ${env.*} placeholders at runtime; the secrets are never written to disk.
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>artifactory-releases</id>
                <username>${env.ARTIFACTORY_USERNAME_REF}</username>
                <password>${env.ARTIFACTORY_TOKEN_REF}</password>
              </server>
              <server>
                <id>artifactory-snapshots</id>
                <username>${env.ARTIFACTORY_USERNAME_REF}</username>
                <password>${env.ARTIFACTORY_TOKEN_REF}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
      # Jib pushes docker.lifs-tools.org/lifs/lifs-goslin-webapp during install and reads the
      # credentials written by docker/login-action.
      - name: Login to LIFS Tools registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.lifs-tools.org
          username: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_USER }}
          password: ${{ secrets.LIFS_TOOLS_DOCKER_REGISTRY_PW }}
      - name: Deploy the jar and push the docker image
        env:
          ARTIFACTORY_USERNAME_REF: ${{ secrets.ARTIFACTORY_USER || 'github-deployer' }}
          ARTIFACTORY_TOKEN_REF: ${{ secrets.ARTIFACTORY_NEW_TOKEN }}
        run: ./mvnw -B deploy -Pdocker -DskipTests
